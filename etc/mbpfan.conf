[general]
# Omarchy fan-control defaults. Copied to /etc/mbpfan.conf so the mbpfan
# daemon and the bar widget can both read the curve.
#
# Temperatures are Celsius. mbpfan only drives Apple SMC fans from CPU
# package temperature; GPU fans are handled separately by the widget when
# the kernel exposes a PWM node.

# Override applesmc min/max if the driver files are missing.
#min_fan1_speed = 2000
#max_fan1_speed = 6200

low_temp = 63
high_temp = 66
max_temp = 86
polling_interval = 1
